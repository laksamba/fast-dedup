[package]
name = "fast-dedup"
version = "0.1.0"
edition = "2024"
authors = ["Laksamba"]
description = "A high-performance file deduplicator CLI built in Rust"

[dependencies]
# CLI argument parsing with derive macros
clap = { version = "4.4", features = ["derive"] }

# Directory traversal that automatically respects .gitignore rules
ignore = "0.4"

# Blazing-fast cryptographic hashing
blake3 = "1.5"

# Data parallelism for multi-threaded hashing
rayon = "1.8"

# Clean, idiomatic error handling definitions
thiserror = "1.0"

# Structured logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"